<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage</title>
<meta name="theme-color" content="#fbf8f2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317785f'/%3E%3Cg transform='translate(16 16) rotate(45)'%3E%3Cpath d='M0-10.5A12.6 12.6 0 0 1 0 10.5A12.6 12.6 0 0 1 0-10.5Z' fill='%23fff'/%3E%3Cpath d='M0 10.5V-2.5' stroke='%2317785f' stroke-width='1.7' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<!-- The app's window (assistant/app.py serves this file; it is never opened as a web page). The look: warm paper,
     one deep green, soft pastel washes, a serif for headlines and a plain sans for everything else, pill buttons,
     rounded cards. The typefaces are files on this computer (/fonts/, fetched once); without them the system's do. -->
<style>
@font-face{font-family:"Fraunces";src:url(/fonts/fraunces.woff2) format("woff2");font-weight:500 700;font-display:swap}
@font-face{font-family:"DM Sans";src:url(/fonts/dmsans.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#fbf8f2; --bg2:#f4eee3; --card:#ffffff;
  --ink:#1d2a33; --muted:#55626e; --dim:#6b7783;
  --line:#e8e0d2; --line2:#d6ccba;
  --green:#17785f; --green-d:#0e5a46; --mint:#e1f3e9; --mint2:#c5e6d4;
  --peach:#fde9d9; --peach-l:#fef4ea; --rust:#9a4216;
  --butter:#fff1c2; --sun:#ffe08a; --amber:#6f4b00;
  --sky:#e3eefb; --navy:#2a5c9a;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --r:20px;
  --shadow:0 1px 2px rgba(29,42,51,.05),0 14px 34px -16px rgba(29,42,51,.16);
  --shadow-lg:0 2px 4px rgba(29,42,51,.05),0 34px 64px -28px rgba(29,42,51,.28);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;cursor:default}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(640px 460px at 92% -2%,var(--mint),transparent 70%),radial-gradient(520px 420px at -6% 44%,var(--peach),transparent 70%),radial-gradient(460px 340px at 56% 108%,var(--butter),transparent 72%);opacity:.9;pointer-events:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}

/* ---------- frame ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:64px 1fr}
.top{display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(251,248,242,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);user-select:none}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px;display:block}
.top .sp{flex:1}
.status{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--green-d);background:#fff;border:1px solid var(--mint2);border-radius:999px;padding:6px 14px 6px 12px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status.live .dot{animation:pulse 1.8s infinite}
.status.warn{color:var(--amber);border-color:#ecd98f;background:var(--butter)}.status.warn .dot{background:#d99a00}
.status.off{color:var(--muted);border-color:var(--line2)}.status.off .dot{background:var(--line2)}
@keyframes pulse{50%{opacity:.3}}
.stage{overflow:auto;padding:0 28px;display:grid}
#screen{display:grid;min-width:0}
.screen{max-width:1080px;width:100%;margin:0 auto;align-self:center;padding:36px 0 44px;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.ln{animation:none!important;transition:none!important}}
.split{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:56px;align-items:center}
.solo{max-width:660px;margin:0 auto;width:100%}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:28px}.split .demo{display:none}}

/* ---------- type ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--green-d);background:#fff;border:1px solid var(--mint2);border-radius:999px;padding:5px 14px 5px 12px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
h1{font-size:clamp(34px,4.4vw,52px);margin-top:20px;letter-spacing:-.025em}
h1 em,h2 em{font-style:normal;background:linear-gradient(transparent 64%,var(--sun) 64%,var(--sun) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em}
h2{font-size:26px}
.lede{font-size:18px;color:var(--muted);margin-top:18px;max-width:52ch}
.proof{margin-top:20px;font-size:14.5px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.proof svg{flex:none;margin-top:3px}
.proof b{color:var(--ink);font-weight:600}
.fine{font-size:13.5px;color:var(--dim)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15.5px;border-radius:999px;padding:13px 24px;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s,color .15s,opacity .15s;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 10px 22px -12px rgba(23,120,95,.7)}
.btn.primary:hover:not(:disabled){background:var(--green-d);transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(23,120,95,.75)}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:var(--green);color:var(--green-d)}
.btn.small{padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--green-d);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--mint2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--green)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}

/* ---------- forms ---------- */
.field{margin-top:24px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.inp{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:14px 18px;font-size:17px;color:var(--ink);transition:border-color .15s,box-shadow .15s;cursor:text}
.inp::placeholder{color:#b3aa98}
.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--mint)}
.inp.big{font-size:22px;padding:17px 20px;font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border-radius:999px;padding:6px 15px;font-size:13.5px;font-weight:600;border:1.5px solid var(--line2);color:var(--muted);background:#fff}
button.chip{cursor:pointer;transition:border-color .15s,color .15s}button.chip:hover{border-color:var(--green);color:var(--green-d)}
.chip.ok{background:var(--green);border-color:var(--green);color:#fff}
.owner{display:grid;grid-template-columns:1fr 1.15fr 40px;gap:10px;margin-bottom:10px}
.owner .inp{font-size:16px;padding:12px 16px}
.x{width:40px;height:40px;align-self:center;border-radius:50%;border:1.5px solid var(--line2);background:#fff;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.x:hover{border-color:var(--rust);color:var(--rust)}
.err{margin-top:16px;background:var(--peach-l);border:1px solid var(--peach);color:#6e3413;border-radius:14px;padding:11px 15px;font-size:14.5px}
details.more{margin-top:18px;font-size:14.5px;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:inline-block;width:18px;color:var(--green);font-weight:700}
details.more[open] summary::before{content:"–"}

/* ---------- the look-ahead card ---------- */
.demo{position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);padding:24px 24px 26px}
.demo-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--dim);background:var(--bg2);border-radius:999px;padding:3px 11px;margin-bottom:16px}
.ln{animation:rise .5s var(--ease) both}.ln:nth-child(3){animation-delay:.12s}.ln:nth-child(4){animation-delay:.24s}.ln:nth-child(5){animation-delay:.36s}
.who{font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:7px}
.bubble{display:inline-block;background:var(--sky);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:15.5px;line-height:1.45;max-width:92%}
.arrow{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;font-weight:500;margin:12px 0 12px 8px}
.arrow i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--green-d);font-size:13px}
.arrow b{color:var(--ink);font-weight:600}
.reply{border:1.5px dashed var(--mint2);background:#f5fbf8;border-radius:18px;padding:16px 18px}
.reply .txt{font-size:15px;line-height:1.5}
.gate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.held{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--amber);background:var(--butter);border-radius:999px;padding:5px 12px}
.held::before{content:"";width:7px;height:7px;border-radius:50%;background:#d99a00;animation:pulse 1.6s infinite}

/* ---------- cards, lists ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:28px}
.card.mint{background:var(--mint);border-color:var(--mint2);box-shadow:none}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:30px;color:var(--green-d);flex:none}
.avatar.lg{width:104px;height:104px;font-size:44px;position:relative;margin:0 auto}
.avatar.lg::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--mint2);border-top-color:var(--green);animation:spin 1.1s linear infinite}
.avatar.lg.done::after{animation:none;border-color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.stages{list-style:none;margin:30px auto 0;padding:0;display:grid;gap:10px;max-width:420px;text-align:left}
.stages li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:15.5px;color:var(--dim);transition:color .3s,border-color .3s}
.stages li.on{color:var(--ink);border-color:var(--mint2)}.stages li.done{color:var(--ink)}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:transparent;font-size:14px;font-weight:700;flex:none;transition:background .3s,color .3s}
li.on .tick{background:var(--mint);font-size:0}li.on .tick::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--mint2);border-top-color:var(--green);animation:spin .8s linear infinite}
li.done .tick,.tick.ok{background:var(--green);color:#fff}
.tick.todo{background:var(--butter);color:var(--amber)}
.items{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
.items li{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.items b{font-weight:600;font-size:15.5px;display:block}
.items span.d{font-size:14px;color:var(--muted);display:block}
.stages.wide{max-width:none;margin-top:26px}
.stages li small{display:block;font-size:13px;color:var(--muted);min-height:0}
.stages li small:empty{display:none}
ol.how{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:15px;color:var(--muted);line-height:1.6}
ol.how b{color:var(--ink);font-weight:600}
ol.how .btn{margin-right:6px}
.chip.copy{cursor:pointer;margin:0 4px;padding:4px 12px;font-size:13px;border-color:var(--mint2);color:var(--green-d);background:#f5fbf8;transition:background .15s,color .15s,border-color .15s}
.chip.copy:hover{border-color:var(--green)}
.inp.gin{display:block;margin-top:8px;font-size:14.5px;padding:10px 14px;border-radius:12px;font-family:ui-monospace,Consolas,monospace}
.card.ask{margin-top:24px}.card.ask h3{font-size:22px}.card.ask p{margin-top:8px;font-size:15.5px;max-width:56ch}
.haves{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.have{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 9px;font-size:14px;font-weight:500;color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--mint2);border-top-color:var(--green);animation:spin .8s linear infinite;vertical-align:-3px}
.wait{display:flex;gap:12px;align-items:center;margin-top:22px;font-size:15px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.okbox{display:flex;gap:14px;align-items:center;margin-top:24px;background:var(--mint);border-radius:18px;padding:16px 20px;font-size:15.5px}
.okbox b{font-weight:600}.okbox svg{flex:none;width:24px;height:24px}.okbox svg circle{fill:#fff}
.steps{display:grid;gap:12px;margin-top:26px}
.layer{display:grid;grid-template-columns:36px 1fr;gap:16px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:border-color .2s,transform .2s}
.layer:hover{border-color:var(--green);transform:translateX(4px)}
.layer .i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--green-d);font-size:13.5px;font-weight:700}
.layer:nth-child(2) .i{background:var(--sky);color:var(--navy)}.layer:nth-child(3) .i{background:var(--butter);color:var(--amber)}.layer:nth-child(4) .i{background:var(--peach);color:var(--rust)}
.layer h3{font-size:18.5px}
.layer p{color:var(--muted);font-size:15px;margin-top:5px}
.layer .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:22px;align-items:start;width:100%}
@media (max-width:860px){.home{grid-template-columns:1fr}}
.hero-card{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center}
.hero-card h2{font-size:32px}
.hero-card .sub{color:var(--muted);font-size:15.5px;margin-top:6px}
.next{margin-top:22px}
.kicker{display:inline-block;font-size:13px;font-weight:700;color:var(--green-d);background:#fff;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.next h3{font-size:22px}
.next p{color:var(--ink);opacity:.82;font-size:15.5px;margin-top:8px;max-width:52ch}
.conn{list-style:none;margin:14px 0 0;padding:0}
.conn li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.conn li:first-child{border-top:0}
.conn b{font-weight:600;font-size:15px;display:block}.conn span.d{font-size:13.5px;color:var(--muted);display:block}
.foot{margin-top:18px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#17785f"/><g transform="translate(16 16) rotate(45)"><path d="M0-10.5A12.6 12.6 0 0 1 0 10.5A12.6 12.6 0 0 1 0-10.5Z" fill="#fff"/><path d="M0 10.5V-2.5" stroke="#17785f" stroke-width="1.7" stroke-linecap="round"/></g></svg>Sage</div>
    <div class="sp"></div>
    <div id="status"></div>
  </div>
  <div class="stage"><div id="screen"></div></div>
</div>

<script>
const KEY = "__SAGE_KEY__";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const CHECK = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="#e1f3e9"/><path d="M5 9.4l2.6 2.6L13 6.6" stroke="#0e5a46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAMES = ["Juno", "Pip", "Wren", "Otis", "Ember", "Mabel"];
let S = {}, cur = "", CH = null, timer = null, started = false, busy = false, wokeOnce = false, wakeErr = "";
let D = {org: "", what: "", agent: "", owners: [{name: "", email: ""}], folder: "", error: ""};
try { D = Object.assign(D, JSON.parse(localStorage.getItem("sage-draft") || "{}")); } catch (e) {}
const keep = () => { try { localStorage.setItem("sage-draft", JSON.stringify(D)); } catch (e) {} };

async function api(path, body) {
  const o = body === undefined ? {headers: {"X-Sage-Key": KEY}, cache: "no-store"}
    : {method: "POST", headers: {"Content-Type": "application/json", "X-Sage-Key": KEY}, body: JSON.stringify(body)};
  try { return await (await fetch("/api/" + path, o)).json(); } catch (e) { return {ok: false, message: "The app lost touch with its own service. Close this window and open Sage again."}; }
}
async function job(p, onLine, onStep) {
  const d = await p;
  if (!d.ok || !d.job) return d;
  for (;;) {
    await sleep(600);
    const j = await api("job", {id: d.job});
    if (onStep && j.step) onStep(j.step);
    if (onLine && j.line) onLine(j.line);
    if (j.status !== "running") return j.result || {ok: false, message: j.message || "It stopped before finishing."};
  }
}
async function load() { const s = await api("state"); if (s && s.app) S = s; drawStatus(); return S; }
const agent = () => S.agent || D.agent.trim() || "your agent";
const orgName = () => S.org || D.org.trim() || "your organization";
const first = () => S.first_name || (D.owners[0].name.trim().split(/\s+/)[0]) || "your";
const initial = () => (S.agent || D.agent.trim() || "S").trim().charAt(0).toUpperCase();

function drawStatus() {
  const el = $("#status");
  if (!S.pack) { el.innerHTML = ""; return; }
  const [cls, txt] = S.paused ? ["warn", agent() + " is paused"] : S.serve_running ? ["live", agent() + " is running"] : started ? ["warn", "Waking " + agent()] : ["off", agent() + " is asleep"];
  el.innerHTML = '<span class="status ' + cls + '"><span class="dot"></span>' + esc(txt) + '</span>';
}
function show(name) {
  if (timer) { clearInterval(timer); timer = null; }
  cur = name;
  const el = $("#screen");
  el.innerHTML = '<div class="screen">' + SCREENS[name]() + '</div>';
  $(".stage").scrollTop = 0;
  (AFTER[name] || (() => {}))(el);
  const f = el.querySelector("[autofocus]"); if (f) f.focus();
}
const eyebrow = t => '<span class="eyebrow"><span class="dot"></span>' + esc(t) + '</span>';
function lookAhead() {
  return '<div class="demo" id="demo"><span class="demo-tag">A look ahead</span>' +
    '<div class="ln"><div class="who">A customer, 9:14 am</div><div class="bubble">Hi! Do you have anything open next week?</div></div>' +
    '<div class="ln arrow"><i>&darr;</i><span><b data-p="agent">' + esc(D.agent.trim() || "Your agent") + '</b> reads it and drafts a reply</span></div>' +
    '<div class="ln reply"><div class="who">Draft, from <span data-p="org">' + esc(D.org.trim() || "your organization") + '</span></div>' +
    '<div class="txt">Hi! Thanks for reaching out to <span data-p="org">' + esc(D.org.trim() || "us") + '</span>. We do have openings next week. Would Tuesday morning or Thursday afternoon suit you better?</div>' +
    '<div class="gate"><span class="chip ok">Approve</span><span class="chip">Edit</span><span class="held"><span>Waiting for <span data-p="owner">' + esc(first() === "your" ? "your" : first() + "'s") + '</span> tap</span></span></div></div></div>';
}
function paint() {
  document.querySelectorAll('[data-p="agent"]').forEach(e => e.textContent = D.agent.trim() || "Your agent");
  document.querySelectorAll('[data-p="org"]').forEach(e => e.textContent = D.org.trim() || (e.closest(".txt") ? "us" : "your organization"));
  document.querySelectorAll('[data-p="owner"]').forEach(e => e.textContent = first() === "your" ? "your" : first() + "'s");
}
const split = (left) => '<div class="split"><div>' + left + '</div>' + lookAhead() + '</div>';

          'Project Settings, <b>Google Cloud Platform (GCP) Project</b>, Change project: ' + cv("Copy the project number", g.project_number) + ' then <b>Set project</b>.',
          'Project Settings, <b>Script Properties</b>, Add script property. Property: ' + cv("Copy the name", "RELAY_SECRET") + ' Value: ' + cp("Copy the secret", "secret") + ' then <b>Save script properties</b>.',
          '<b>Deploy</b>, New deployment, gear: <b>Web app</b>. Execute as <b>Me</b>, who has access <b>Anyone</b>, Deploy, and allow it when Google asks. Copy the <b>Web app URL</b> and paste it here:<input class="inp gin" id="gurl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" value="' + esc(g.webapp_url || "") + '">',
          '<b>Deploy</b>, New deployment, gear: <b>Add-on</b>, Deploy. Copy the <b>Deployment ID</b> and paste it here:<input class="inp gin" id="gid" placeholder="AKfyc..." autocomplete="off" value="' + esc(g.deployment_id || "") + '">']) +
        '</div><div id="gmsg"></div><div class="row"><button class="btn primary" id="go">Save and continue</button>' + later + '</div>';
      bind();
      $("#go", box).onclick = async () => {
        const r = await api("google_relay", {url: $("#gurl", box).value, id: $("#gid", box).value});
        if (!r.ok) { $("#gmsg", box).innerHTML = '<div class="err">' + esc(r.message) + '</div>'; return; }
        await refresh();
      };
    };

    const chat = (err) => {
      const g = G.guide || {}, L = g.links || {};
      lede.textContent = "Last part: tell Google Chat who " + A + " is. One page, six fields, then Save.";
      box.innerHTML = '<div class="steps">' +
        part(1, A + "'s page in Google Chat", [
          op("Open the Chat app page", L.chat_config),
          'App name: ' + cv("Copy", g.app_name) + ' Avatar URL: ' + cv("Copy", g.avatar) + ' Description: ' + cv("Copy", g.description),
          'Under <b>Functionality</b> tick <b>Join spaces and group conversations</b>.',
          'Under <b>Connection settings</b> choose <b>Apps Script</b> and paste the Deployment ID: ' + cv("Copy the ID", g.deployment_id),
          'Under <b>Visibility</b> make ' + esc(A) + ' available to specific people: ' + cv("Copy the addresses", g.owners),
          '<b>Save</b>.']) +
        '</div><div id="gmsg">' + (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>' +
        '<div class="row"><button class="btn primary" id="go">Check the connection</button><button class="link" id="back">Back to the relay</button>' + later + '</div>';
      bind();
      $("#back", box).onclick = relay;
      $("#go", box).onclick = async () => {
        $("#gmsg", box).innerHTML = '<div class="wait"><span class="spin"></span>Checking that ' + esc(A) + ' and Google can reach each other</div>';
        const r = await job(api("google_check", {}));
        G = await api("google_status", {}); await load();
        if (cur !== "google") return;
        if (r.ok) draw(); else chat(r.message || "The check did not pass yet.");
      };
    };

    const done = () => {
      lede.textContent = A + " is in Google Chat. Open a new chat, find " + A + " by name, and say hello: it answers there, and starts learning about " + orgName() + " one question at a time.";
      box.innerHTML = '<div class="okbox">' + CHECK + '<span><b>Connected.</b> ' + esc(A) + ' and Google can reach each other.</span></div>' +
        '<div class="row"><button class="btn primary" data-open="https://chat.google.com/">Open Google Chat</button><button class="btn ghost" id="later">Done</button></div>';
      bind();
    };

    const draw = () => {
      if (!G.ok) { box.innerHTML = '<div class="err">' + esc(G.message || "Not ready yet.") + '</div><div class="row">' + later + '</div>'; return bind(); }
      if (G.checked || (S.chat_connected && !G.steps.some(x => x.status === "done"))) return done();
      if (!G.auto_done) return auto();
      if (!G.relay_done) return relay();
      return chat();
    };
    draw();
  },
  home: el => {
    const p = $("#pause", el), w = $("#wake", el), n = $("#next", el), nx = nextStep();
    if (p) p.onclick = async () => { p.disabled = true; await api(S.paused ? "resume" : "pause", {}); await load(); show("home"); };
    if (w) w.onclick = () => { wokeOnce = false; wake(); show("home"); };
    if (n) n.onclick = () => nx.open ? api("open", {url: nx.open}) : show(nx.go);
    $("#folder", el).onclick = () => api("open", {folder: true});
    el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));
    let sig = JSON.stringify([S.serve_running, S.paused, S.auth_ok, S.chat_connected, S.google_accounts, started]);
    timer = setInterval(async () => {
      await load();
      const s2 = JSON.stringify([S.serve_running, S.paused, S.auth_ok, S.chat_connected, S.google_accounts, started]);
      if (s2 !== sig && cur === "home") show("home");
    }, 4000);
    if (!S.serve_running && !started && !wokeOnce) wake();
    if (wakeErr && !S.serve_running) { const c = document.createElement("div"); c.className = "err"; c.style.marginBottom = "18px"; c.textContent = agent() + " did not wake up. " + wakeErr; $(".home", el).before(c); }
  },
};
async function wake() {
  if (started || S.serve_running || !S.pack) return;
  started = true; wokeOnce = true; wakeErr = ""; drawStatus();
  const r = await job(api("start", {}));
  started = false; await load();
  wakeErr = r.ok ? "" : (r.message || "Try again in a moment.");
  if (cur === "home") show("home");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) api("open", {url: b.dataset.open}); });
document.addEventListener("click", async e => {
  const c = e.target.closest("[data-copy],[data-copyv]");
  if (!c) return;
  const was = c.textContent, say = t => { c.textContent = t; c.classList.toggle("ok", t === "Copied"); setTimeout(() => { c.textContent = was; c.classList.remove("ok"); }, 1400); };
  let t = c.dataset.copyv;
  if (t === undefined) { const r = await api("google_text", {what: c.dataset.copy}); if (!r.ok) return say("Not available"); t = r.text; }
  try { await navigator.clipboard.writeText(t); say("Copied"); }
  catch (err) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); say(ok ? "Copied" : "Could not copy"); }
});
setInterval(() => { if (!timer) load(); }, 9000);          // keeps the window's own service awake, and the status pill true

(async () => {
  await load();
  if (!S.app) { $("#screen").innerHTML = '<div class="screen"><div class="solo"><h1>Sage could not start.</h1><p class="lede">Close this window and open Sage again from the Start menu.</p></div></div>'; return; }
  if (!S.pack) return show(D.org.trim() ? "org" : "intro");
  if (!S.auth_ok) return show("claude");
  show("home");
})();
</script>
</body>
</html>
